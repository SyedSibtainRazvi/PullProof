name: PullProof
description: AI-powered blog & documentation reviewer for pull requests. Reviews .md/.mdx changes and posts feedback as a PR comment.
author:
  name: Syed Sibtain
  email: syedsibtain191@gmail.com

branding:
  icon: book-open
  color: blue

inputs:
  github_token:
    description: "GitHub Token for authentication"
    required: true
  openai_api_key:
    description: "OpenAI API Key for AI-based review"
    required: true
  model:
    description: "OpenAI model to use"
    required: false
    default: "gpt-4o"

runs:
  using: composite
  steps:
    - run: chmod +x ${{ github.action_path }}/review.sh && ${{ github.action_path }}/review.sh
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ github.event.number }}
        REPO: ${{ github.repository }}
